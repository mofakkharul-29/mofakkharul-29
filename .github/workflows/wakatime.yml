name: WakaTime Readme Stats

on:
  workflow_dispatch:
  schedule:
    # Runs every 24 hours (at midnight UTC)
    - cron: '0 0 * * *'

jobs:
  update-readme:
    name: Update Readme with WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - name: Debug GH_TOKEN
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "Error: GH_TOKEN secret is empty or not found!"
            exit 1 # Fail the workflow if the token is truly missing
          else
            echo "GH_TOKEN secret found and is not empty. Proceeding."
          fi

      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: wakatime_stats
          SHOW_TOTAL_CODE_TIME: true
          SHOW_LANGUAGE: true
          SHOW_LINES_OF_CODE: false # This input is still valid
          # The following inputs are no longer valid and must be removed:
          # TIME_RANGE: all_time
          # THEME: radical
          # HIDE_BORDER: false

          # Optional advanced settings (uncomment if you want to use them, these are valid):
          # LANG_COUNT: 20
          # CODE_TIME_FORMAT: "short"
          # SHOW_OTHER_STATS: false
          # COMMIT_BY_TOP_LANGUAGE: true
          # SHOW_PROFILE_VIEWS: true # To show profile views
          # SHOW_DAYS_OF_WEEK: true # To show daily coding activity chart
          # SHOW_LOC_CHART: true # To show lines of code chart
