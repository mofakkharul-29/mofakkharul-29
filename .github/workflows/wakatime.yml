name: WakaTime Readme Stats

on:
  workflow_dispatch:
  schedule:
    # Runs every 24 hours (at midnight UTC)
    - cron: '0 0 * * *'

jobs:
  update-readme:
    name: Update Readme with WakaTime Stats
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@v3 # <--- IMPORTANT CHANGE: Use @v3 for stability
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: wakatime_stats
          SHOW_TOTAL_CODE_TIME: true
          SHOW_LANGUAGE: true
          # TIME_RANGE: all_time # <--- THIS LINE IS REMOVED
          # THEME: radical # <--- THIS LINE IS REMOVED
          # HIDE_BORDER: false # <--- THIS LINE IS REMOVED
          SHOW_LINES_OF_CODE: false # Keeping this as it's a valid option
          # Optional advanced settings (uncomment if you want to use them)
          # LANG_COUNT: 20
          # CODE_TIME_FORMAT: "short"
          # SHOW_OTHER_STATS: false
          # COMMIT_BY_TOP_LANGUAGE: true
          # SHOW_PROFILE_VIEWS: true # Added this as it was in valid inputs if you want profile views
          # SHOW_DAYS_OF_WEEK: true # Added this as it was in valid inputs for daily activity
          # SHOW_LOC_CHART: true # Added this as it was in valid inputs for lines of code chart
