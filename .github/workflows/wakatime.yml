name: WakaTime Readme Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  update-readme:
    name: Update Readme with WakaTime Stats
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. This checks if your Token is working
      - name: Debug GH_TOKEN
        run: |
          if [ -z "${{ secrets.GH_TOKEN }}" ]; then
            echo "Error: GH_TOKEN secret is empty or not found!"
            exit 1
          else
            echo "GH_TOKEN secret found and is not empty. Proceeding."
          fi

      # 2. IMPORTANT: This line allows the action to access your files
      - uses: actions/checkout@v3

      # 3. This runs the WakaTime update
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SECTION_NAME: wakatime_stats
          SHOW_TOTAL_CODE_TIME: true
          SHOW_LANGUAGE: true
          SHOW_LINES_OF_CODE: false
